<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nemoforge</title>
    <script>
      // SPA redirect for GitHub Pages.
      // Encodes the current path into the query string and redirects to /
      // so the SPA router can handle it.
      (function () {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
          l.pathname.slice(1).split('/').join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
